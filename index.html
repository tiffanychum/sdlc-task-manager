<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 36px 32px;
      width: 100%;
      max-width: 520px;
      height: fit-content;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 24px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    #task-input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #task-input:focus {
      border-color: #667eea;
    }

    #add-btn {
      padding: 10px 20px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    #add-btn:hover { background: #5a67d8; }
    #add-btn:active { background: #4c51bf; }

    #error-msg {
      color: #e53e3e;
      font-size: 0.875rem;
      margin-bottom: 12px;
      min-height: 1.2em;
    }

    #task-list {
      list-style: none;
    }

    #task-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      transition: background 0.15s;
    }

    #task-list li:hover { background: #edf2f7; }

    .task-title {
      flex: 1;
      font-size: 1rem;
      color: #2d3748;
      word-break: break-word;
      padding-right: 12px;
    }

    .delete-btn {
      padding: 5px 12px;
      background: #fed7d7;
      color: #c53030;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover { background: #feb2b2; }
    .delete-btn:active { background: #fc8181; }

    .empty-state {
      text-align: center;
      color: #a0aec0;
      font-size: 0.95rem;
      padding: 24px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Task Manager</h1>

    <div class="add-form">
      <input
        type="text"
        id="task-input"
        placeholder="Enter a new task…"
        autocomplete="off"
      />
      <button id="add-btn">Add</button>
    </div>

    <div id="error-msg"></div>

    <ul id="task-list"></ul>
  </div>

  <script>
    const API_BASE = '';          // same origin — FastAPI serves this file at /
    const input    = document.getElementById('task-input');
    const addBtn   = document.getElementById('add-btn');
    const listEl   = document.getElementById('task-list');
    const errorEl  = document.getElementById('error-msg');

    /**
     * fetchTasks — fetches all tasks from GET /tasks and re-renders the list.
     * Called on page load and after every create / delete mutation.
     */
    async function fetchTasks() {
      errorEl.textContent = '';
      try {
        const res = await fetch(`${API_BASE}/tasks`);
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        const tasks = await res.json();
        renderList(tasks);
      } catch (err) {
        errorEl.textContent = `Failed to load tasks: ${err.message}`;
      }
    }

    /** Render the task array into the <ul>. */
    function renderList(tasks) {
      listEl.innerHTML = '';
      if (tasks.length === 0) {
        listEl.innerHTML = '<li class="empty-state">No tasks yet — add one above!</li>';
        return;
      }
      tasks.forEach(task => {
        const li = document.createElement('li');

        const span = document.createElement('span');
        span.className = 'task-title';
        span.textContent = task.title;

        const btn = document.createElement('button');
        btn.className = 'delete-btn';
        btn.textContent = 'Delete';
        btn.addEventListener('click', () => deleteTask(task.id));

        li.appendChild(span);
        li.appendChild(btn);
        listEl.appendChild(li);
      });
    }

    /** POST /tasks — create a new task then refresh the list. */
    async function addTask() {
      const title = input.value.trim();
      if (!title) {
        errorEl.textContent = 'Task title cannot be empty.';
        input.focus();
        return;
      }
      errorEl.textContent = '';
      addBtn.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/tasks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title }),
        });
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        input.value = '';
        await fetchTasks();   // refresh list after mutation
      } catch (err) {
        errorEl.textContent = `Failed to add task: ${err.message}`;
      } finally {
        addBtn.disabled = false;
        input.focus();
      }
    }

    /** DELETE /tasks/{id} — delete a task by id then refresh the list. */
    async function deleteTask(id) {
      errorEl.textContent = '';
      try {
        const res = await fetch(`${API_BASE}/tasks/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        await fetchTasks();   // refresh list after mutation
      } catch (err) {
        errorEl.textContent = `Failed to delete task: ${err.message}`;
      }
    }

    // Wire up the Add button and Enter-key shortcut
    addBtn.addEventListener('click', addTask);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    // Initial load
    fetchTasks();
  </script>
</body>
</html>
