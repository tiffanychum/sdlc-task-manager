<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 2rem 2.5rem;
      width: 100%;
      max-width: 520px;
      height: fit-content;
    }

    h1 {
      font-size: 1.8rem;
      color: #1a202c;
      margin-bottom: 1.5rem;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .add-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    #taskInput {
      flex: 1;
      padding: 0.6rem 0.9rem;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #taskInput:focus {
      border-color: #4299e1;
    }

    #addBtn {
      padding: 0.6rem 1.2rem;
      background: #4299e1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    #addBtn:hover {
      background: #3182ce;
    }

    #addBtn:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    #taskList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    #taskList li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      animation: fadeIn 0.15s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-title {
      font-size: 0.97rem;
      color: #2d3748;
      word-break: break-word;
      flex: 1;
      margin-right: 0.75rem;
    }

    .delete-btn {
      padding: 0.3rem 0.75rem;
      background: #fc8181;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      background: #e53e3e;
    }

    .empty-msg {
      text-align: center;
      color: #a0aec0;
      font-size: 0.95rem;
      padding: 1rem 0;
    }

    .error-msg {
      color: #e53e3e;
      font-size: 0.87rem;
      margin-top: 0.4rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Task Manager</h1>

    <div class="add-row">
      <input
        id="taskInput"
        type="text"
        placeholder="Enter a new task…"
        autocomplete="off"
      />
      <button id="addBtn" onclick="addTask()">Add</button>
    </div>
    <div id="errorMsg" class="error-msg" style="display:none;"></div>

    <ul id="taskList"></ul>
  </div>

  <script>
    const API = '';   // same origin; change to 'http://localhost:8000' if serving separately

    // ── Fetch & render all tasks ──────────────────────────────────────────────
    async function fetchTasks() {
      try {
        const res = await fetch(`${API}/tasks`);
        if (!res.ok) throw new Error(`Server error ${res.status}`);
        const tasks = await res.json();
        renderTasks(tasks);
      } catch (err) {
        showError('Could not load tasks: ' + err.message);
      }
    }

    function renderTasks(tasks) {
      const ul = document.getElementById('taskList');
      ul.innerHTML = '';

      if (tasks.length === 0) {
        ul.innerHTML = '<li class="empty-msg">No tasks yet. Add one above!</li>';
        return;
      }

      tasks.forEach(task => {
        const li = document.createElement('li');
        li.id = `task-${task.id}`;

        const span = document.createElement('span');
        span.className = 'task-title';
        span.textContent = task.title;

        const btn = document.createElement('button');
        btn.className = 'delete-btn';
        btn.textContent = 'Delete';
        btn.onclick = () => deleteTask(task.id);

        li.appendChild(span);
        li.appendChild(btn);
        ul.appendChild(li);
      });
    }

    // ── Add a task ────────────────────────────────────────────────────────────
    async function addTask() {
      const input = document.getElementById('taskInput');
      const addBtn = document.getElementById('addBtn');
      const title = input.value.trim();

      if (!title) {
        showError('Task title cannot be empty.');
        return;
      }

      clearError();
      addBtn.disabled = true;

      try {
        const res = await fetch(`${API}/tasks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        if (!res.ok) throw new Error(`Server error ${res.status}`);
        input.value = '';
        await fetchTasks();
      } catch (err) {
        showError('Could not add task: ' + err.message);
      } finally {
        addBtn.disabled = false;
        input.focus();
      }
    }

    // ── Delete a task ─────────────────────────────────────────────────────────
    async function deleteTask(id) {
      clearError();
      try {
        const res = await fetch(`${API}/tasks/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error(`Server error ${res.status}`);
        await fetchTasks();
      } catch (err) {
        showError('Could not delete task: ' + err.message);
      }
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function clearError() {
      const el = document.getElementById('errorMsg');
      el.textContent = '';
      el.style.display = 'none';
    }

    // Allow pressing Enter to add a task
    document.getElementById('taskInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    // ── Bootstrap ─────────────────────────────────────────────────────────────
    fetchTasks();
  </script>
</body>
</html>
